# Public側でUnit Testsが通ったら、Private側の連動ITを起動する。
# fork PRでは pull_request に secrets が渡らないため、baseリポジトリの
# コンテキストで走る workflow_run を経由している。
# このリポジトリはPUBLICなのでActionsは無料。runs-onはGitHub-hostedのままでよい
# (self-hostedはPrivate側の課金回避が目的なので、こちらに載せる理由がない)。
name: Notify Private IT

on:
  workflow_dispatch:
    inputs:
      stations:
        description: 'JSON配列で対象駅を指定。空なら全13駅（例: ["TH58","TH62"]）'
        required: false
        default: ''
      public_sha:
        description: '対象コミットSHA。空なら github.sha'
        required: false
        default: ''
      pr_number:
        description: '対象PR番号。指定するとそのPRの変更ファイルから駅を判定する'
        required: false
        default: ''
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  # 連動図表CSVが存在する既知の駅一覧（唯一の記載箇所）
  KNOWN_STATIONS: "TH58 TH59 TH61 TH62 TH63 TH64 TH65 TH66S TH67 TH70 TH71 TH75 TH76"
  RENDO_TABLE_DIR: Traincrew_MultiATS_Server.Crew/Data/RendoTable

jobs:
  determine-target:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      stations: ${{ steps.stations.outputs.stations }}
      public_sha: ${{ steps.sha.outputs.sha }}
      pr_number: ${{ steps.pr.outputs.number }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Resolve target SHA
        id: sha
        env:
          IN_SHA: ${{ inputs.public_sha }}
          EVENT_NAME: ${{ github.event_name }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$IN_SHA" ]; then
            echo "sha=$IN_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "sha=$WR_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$DEFAULT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_STATIONS: ${{ inputs.stations }}
          IN_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "mode=targeted" >> "$GITHUB_OUTPUT"
          elif [ -n "$IN_STATIONS" ]; then
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          elif [ -n "$IN_PR_NUMBER" ]; then
            echo "mode=targeted" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR number
        id: pr
        if: steps.mode.outputs.mode == 'targeted'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          IN_PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=$IN_PR_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # workflow_run.pull_requests は fork PR で空になる既知の問題があるため、
          # まず head_sha からコミット経由で逆引きする
          PR_NUMBER=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number // empty')

          # 逆引きに失敗した場合、open PR一覧からhead.shaが一致するものを探すフォールバック
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api "repos/${REPO}/pulls" --jq \
              ".[] | select(.head.sha == \"${SHA}\") | .number" | head -n1)
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::PRに紐づかない実行のためスキップします (sha=${SHA})"
          fi

          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Get changed files
        id: changed_files
        if: steps.mode.outputs.mode == 'targeted' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # PRのコードは一切checkout/実行しない。APIのみで完結させる（pwn request対策）
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename' > changed_files.txt
          cat changed_files.txt

      - name: Extract target stations
        id: stations
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          IN_STATIONS: ${{ inputs.stations }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -e
          KNOWN_LIST=$(printf '%s\n' $KNOWN_STATIONS)
          # 正規表現の特殊文字（RENDO_TABLE_DIR中の "." など）をエスケープする
          RENDO_DIR_RE=$(printf '%s' "$RENDO_TABLE_DIR" | sed 's/[.[\*^$/]/\\&/g')

          if [ "$MODE" = "full" ]; then
            STATIONS_RAW=$(printf '%s\n' $KNOWN_STATIONS)
          elif [ "$MODE" = "manual" ]; then
            STATIONS_RAW=$(printf '%s' "$IN_STATIONS" | jq -r '.[]')
          elif [ "$MODE" = "targeted" ]; then
            if [ -z "$PR_NUMBER" ] || [ ! -s changed_files.txt ]; then
              echo "stations=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            STATIONS_RAW=$(grep -E "^${RENDO_DIR_RE}/[^/]+\.csv$" changed_files.txt \
              | sed -E "s#^${RENDO_DIR_RE}/##; s/\.csv$//" || true)
          else
            echo "stations=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 既知13駅リストと突き合わせ、未知のものは弾く
          VALID_STATIONS=""
          for s in $STATIONS_RAW; do
            if printf '%s\n' $KNOWN_LIST | grep -qx "$s"; then
              VALID_STATIONS="$VALID_STATIONS $s"
            else
              echo "::warning::未知の駅IDのため対象から除外します: $s"
            fi
          done

          STATIONS_JSON=$(printf '%s\n' $VALID_STATIONS | grep -v '^$' | sort -u | jq -R . | jq -sc .)
          echo "stations=${STATIONS_JSON}" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: determine-target
    if: needs.determine-target.outputs.stations != '' && needs.determine-target.outputs.stations != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: daidoji-traincrew-office
          repositories: Traincrew_Rendo_Server

      - name: Dispatch to private IT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STATIONS: ${{ needs.determine-target.outputs.stations }}
          SHA: ${{ needs.determine-target.outputs.public_sha }}
          PR: ${{ needs.determine-target.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --argjson stations "$STATIONS" \
            --arg sha "$SHA" \
            --arg pr  "$PR" \
            --arg repo "$REPO" \
            '{event_type:"public-it-request", client_payload:{stations:$stations, public_sha:$sha, pr_number:$pr, check_repo:$repo}}' \
          | gh api repos/daidoji-traincrew-office/Traincrew_Rendo_Server/dispatches --input -

      - name: Summary
        env:
          MODE: ${{ needs.determine-target.outputs.mode }}
          STATIONS: ${{ needs.determine-target.outputs.stations }}
          SHA: ${{ needs.determine-target.outputs.public_sha }}
          PR: ${{ needs.determine-target.outputs.pr_number }}
        run: |
          {
            echo "## Notify Private IT - dispatch結果"
            echo ""
            echo "- mode: \`${MODE}\`"
            echo "- stations: \`${STATIONS}\`"
            echo "- public_sha: \`${SHA}\`"
            echo "- pr_number: \`${PR}\`"
          } >> "$GITHUB_STEP_SUMMARY"
