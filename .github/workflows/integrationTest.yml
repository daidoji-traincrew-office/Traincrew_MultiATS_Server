name: Integration Tests

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - id: check
        name: Check for open PRs (skip push if PR exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq 'length')
            if [ "$count" -gt 0 ]; then
              echo "should_skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "should_skip=false" >> $GITHUB_OUTPUT

  test:
    needs: check-skip
    if: needs.check-skip.outputs.should_skip == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        if: github.event_name == 'pull_request'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Merge PR branch into base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "refs/heads/${{ github.event.pull_request.head.ref }}:refs/remotes/origin/${{ github.event.pull_request.head.ref }}"
          git checkout ${{ github.event.pull_request.base.ref }}
          git merge --no-ff "origin/${{ github.event.pull_request.head.ref }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Start Database
        working-directory: ./Database
        run: docker compose up -d

      - name: Run Integration Tests
        working-directory: ./Traincrew_MultiATS_Server.IT
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~InterlockingLogicTest"
      - name: Output Database Logs
        # 何故かログを出すとITが通るのでこうしている
        if: always()
        working-directory: ./Database
        run: docker compose logs
        
