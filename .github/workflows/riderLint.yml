name: Rider Lint

on:
  pull_request:
    paths:
      - '**/*.cs'
      - '.editorconfig'
      - '*.sln.DotSettings'
      - '.config/dotnet-tools.json'
      - '.github/scripts/rider_lint.py'
      - '.github/workflows/riderLint.yml'
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore ReSharper CLI cache
        id: rider-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rider-lint
          key: rider-lint-${{ runner.os }}-${{ hashFiles('.editorconfig', '*.sln.DotSettings', '.config/dotnet-tools.json') }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore dotnet tools
        run: dotnet tool restore

      # inspectcode / cleanupcode は --no-build で動かすため、先にビルドしておく
      - name: Build
        run: dotnet build --no-restore

      - name: Run Rider lint (changed lines only)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE="$(git merge-base "origin/${BASE_REF:-main}" HEAD)"
          python3 -I .github/scripts/rider_lint.py check --sln Traincrew_MultiATS_Server.sln \
            --base "$BASE" --format github

      - name: Save ReSharper CLI cache
        if: always() && steps.rider-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/rider-lint
          key: rider-lint-${{ runner.os }}-${{ hashFiles('.editorconfig', '*.sln.DotSettings', '.config/dotnet-tools.json') }}
