name: Rider Lint

on:
  pull_request: { }
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Run Rider lint (changed lines only)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          .github/scripts/rider_lint.sh --sln Traincrew_MultiATS_Server.sln \
            --base "origin/${BASE_REF:-main}" --format github
